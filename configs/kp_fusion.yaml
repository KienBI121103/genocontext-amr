project:
  name: GenoContext-AMR
  model_name: GenoContext-GNN-Fusion
paths:
  manifest: /mnt/nas/earth/KienNM/amrgnn_multi/kpneumoniae/sample_manifest.csv
  phenotypes: /mnt/nas/earth/KienNM/amrgnn_multi/kpneumoniae/phenotype/ast_labels.csv
  amrgnn_root: /mnt/nas/earth/KienNM/amrgnn_multi/kpneumoniae
  artifacts: /mnt/nas/earth/KienNM/genecontext-gnn/Kp_collected/fusion_v1
  parsed_cache: /mnt/nas/earth/KienNM/genecontext-gnn/Kp_collected/features/parsed_gff
bakta:
  db: /home/kiennm/AMR/amromics/db/bakta/db
  threads: 4
features:
  min_category_frequency: 5
graph:
  neighbor_k: 1
model:
  hidden_dim: 128
  dropout: 0.2
  pooling: mean_max_count
training:
  epochs: 100
  patience: 15
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  checkpoint_metric: auroc
  cpu_threads: 8
  rf_threads: 32
  preprocess_workers: 16
fusion:
  enabled: true
experiment:
  seeds: [0, 1, 2]
  antibiotics: [ciprofloxacin]
explain:
  test_isolates_per_run: 3
  top_genes: 5
  neighborhood_k: 2
