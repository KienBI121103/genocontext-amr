[project]
name = "genocontext-amr"
version = "0.1.0"
description = "GFF3 gene-neighborhood models for antimicrobial resistance"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "torch==2.11.*",
    "torch-geometric>=2.7,<2.8",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
