[project]
name = "genocontext"
version = "2.0.0.dev0"
description = "Knowledge-guided gene-state graph models for antimicrobial resistance prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "biopython>=1.84,<2",
    "lightgbm>=4.5,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "torch==2.11.*",
    "torch-geometric>=2.7,<2.8",
]

[project.scripts]
genocontext = "genocontext.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genocontext"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["genocontext"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "torch_geometric.*", "Bio.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["genocontext.features.targets"]
disallow_untyped_calls = false  # Biopython's aligner API is untyped
